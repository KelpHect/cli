name: Unit and Integration Tests
on:
  push:
    branches:
      - sentinel-bench/b01a

permissions:
  contents: read

jobs:
  # sentinel-bench/b01a: the ubuntu-latest build row only, on the reference host's runner.
  build:
    runs-on: p14-cli

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Download dependencies
        run: go mod download

      - name: Run unit and integration tests
        # pilots-ci freshness: every test runs on every sample, as in Sentinel's lane; a restored GOCACHE
        # would otherwise serve cached test results.
        env:
          GOFLAGS: -count=1
        run: go test -race -tags=integration ./...

      - name: Build
        run: go build -v ./cmd/gh

      - name: Build with debug overrides
        run: go build -v -tags=ghdebug ./cmd/gh
